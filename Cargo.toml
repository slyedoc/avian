[workspace]
members = ["crates/avian2d", "crates/avian3d"]
exclude = ["benches"]
resolver = "2"

[workspace.lints.clippy]
alloc_instead_of_core = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"

[profile.dev]
opt-level = 1 # Use slightly better optimization, so examples work

# Use the locally ported bevy-main worktrees for the bevy-coupled crates —
# the slyedoc GitHub branches lag behind the local ports.
[patch."https://github.com/slyedoc/bevy_heavy"]
bevy_heavy = { path = "/mnt/code/f/bevy_heavy-main" }

[patch."https://github.com/slyedoc/bevy_transform_interpolation"]
bevy_transform_interpolation = { path = "/mnt/code/f/bevy_transform_interpolation-main" }

[patch."https://github.com/slyedoc/glam_matrix_extras"]
glam_matrix_extras = { path = "/mnt/code/f/glam_matrix_extras" }
