[workspace]
members = ["crates/avian2d", "crates/avian3d"]
exclude = ["benches"]
resolver = "2"

[workspace.lints.clippy]
alloc_instead_of_core = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"

[profile.dev]
opt-level = 1 # Use slightly better optimization, so examples work

# ---------------------------------------------------------------------------
# Solari integration (example/dev only): the `solari_cubes` example uses
# bevy_solari's native floating origin. Adding it forces all of avian's bevy to
# resolve from the Solari fork (you can't patch bevy for one example), plus the
# wgpu/naga forks Solari's RT pipeline needs. The avian CORE itself has no
# bevy_solari dependency — this is purely so the example can render.
# Keep in lockstep with f/bevy's own [patch] recipe.
# ---------------------------------------------------------------------------
[patch."https://github.com/bevyengine/bevy"]
bevy = { git = "https://github.com/slyedoc/bevy", branch = "solari-rt-pipeline" }
bevy_a11y = { git = "https://github.com/slyedoc/bevy", branch = "solari-rt-pipeline" }
